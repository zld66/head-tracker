name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install opencv-python pyautogui pillow numpy pyinstaller
    
    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name "人头追踪工具" face_detector.py
    
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: head-tracker-exe
        path: dist/人头追踪工具.exe
