name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install opencv-python pyautogui pillow numpy pyinstaller
    
    - name: Download Haar Cascade
      run: |
        curl -o haarcascade_frontalface_default.xml https://raw.githubusercontent.com/opencv/opencv/master/data/haarcascades/haarcascade_frontalface_default.xml
    
    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name "screen-tracker" --add-data "haarcascade_frontalface_default.xml;." face_detector.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: screen-tracker
        path: dist/screen-tracker.exe
        if-no-files-found: error
